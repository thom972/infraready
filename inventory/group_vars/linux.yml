---
# Variables communes au groupe [linux] de inventory.ini - aucun secret ici.
ansible_become: true                          # taches executees avec sudo (compte ansible, voir E-14)
ansible_python_interpreter: /usr/bin/python3  # interpreteur fixe : supprime l'avertissement de detection
web_package: nginx                            # paquet du service web a installer
web_service: nginx                            # service systemd correspondant

# Maintenance et verification
services_critiques: [ssh, nginx]
volumes_surveilles: ['/', '/boot', '/srv/infraready']

# Pare-feu (playbooks/securite.yml) : tout le reste est refuse en entree
regles_pare_feu:
  - { port: 22,   source: 192.168.50.1,    commentaire: "SSH administration depuis l'hote" }
  - { port: 22,   source: 192.168.50.30,   commentaire: "SSH Ansible depuis OPS01" }
  - { port: 80,   source: 192.168.50.0/24, commentaire: "Nginx depuis le labo" }
  - { port: 9100, source: 192.168.50.30,   commentaire: "node_exporter collecte par Prometheus (OPS01)" }
