---
# Connexion WinRM vers WIN-DC01 - le mot de passe est dans vault.yml (chiffre)
ansible_connection: winrm
ansible_port: 5985
ansible_winrm_scheme: http
ansible_winrm_transport: ntlm          # NTLM chiffre les echanges meme sur HTTP
ansible_user: svc-ansible@infraready.test

# Maintenance et verification
services_critiques: [NTDS, DNS, Netlogon, Kdc, WinRM, LanmanServer]

# Supervision
windows_exporter_version: "0.31.8"
windows_exporter_depot: "https://github.com/prometheus-community/windows_exporter/releases/download"
windows_exporter_url: "{{ windows_exporter_depot }}/v{{ windows_exporter_version }}/windows_exporter-{{ windows_exporter_version }}-amd64.msi"
windows_exporter_regle: "InfraReady - windows_exporter depuis OPS01"
