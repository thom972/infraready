---
# Inventaire InfraReady - aucun secret ici.
# Variables : inventory/group_vars/ (par groupe) et inventory/host_vars/ (par hote).
all:
  children:
    serveurs_linux:
      children:
        linux:
          hosts:
            LINUX01:
              ansible_host: 192.168.50.20
              ansible_user: ansible
              ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
        ops:
          hosts:
            OPS01:
              ansible_connection: local   # OPS01 se gere lui-meme, sans SSH
    windows:
      hosts:
        WIN-DC01:
          ansible_host: 192.168.50.10
