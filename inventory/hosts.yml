# Inventaire Ansible InfraReady — séance 2
# Format YAML conformément au sujet fil rouge (§7) ; aucun secret ici.
all:
  children:
    linux:
      hosts:
        LINUX01:
          ansible_host: 192.168.50.20
      vars:
        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
