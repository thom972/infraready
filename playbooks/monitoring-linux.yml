---
- name: Supervision de LINUX01
  hosts: linux
  become: true

  tasks:
    - name: Installer Node Exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true

    - name: Activer et demarrer Node Exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Verifier les metriques
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        status_code: 200