# Regles d'alerte InfraReady - deployees vers /etc/prometheus/alertes.yml sur OPS01.
# Etat visible dans Prometheus (menu Alerts) et dans le tableau de bord Grafana.
---
groups:
  - name: infraready
    rules:
      - alert: HoteInjoignable
        expr: up == 0
        for: 1m
        labels:
          severite: critique
        annotations:
          resume: "{{ $labels.hote }} ({{ $labels.job }}) ne repond plus a la collecte"
          description: "La cible {{ $labels.instance }} est DOWN depuis plus d'une minute."

      - alert: EspaceDisqueFaibleLinux
        expr: (node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) < 0.15
        for: 5m
        labels:
          severite: attention
        annotations:
          resume: "{{ $labels.hote }} : moins de 15 % d'espace libre sur {{ $labels.mountpoint }}"
          description: "Espace libre : {{ $value | humanizePercentage }} (seuil 15 %, comme verification.yml)."

      - alert: EspaceDisqueFaibleWindows
        expr: (windows_logical_disk_free_bytes{volume="C:"} / windows_logical_disk_size_bytes{volume="C:"}) < 0.15
        for: 5m
        labels:
          severite: attention
        annotations:
          resume: "{{ $labels.hote }} : moins de 15 % d'espace libre sur C:"
          description: "Espace libre : {{ $value | humanizePercentage }} (seuil 15 %)."

      - alert: ProcesseurSature
        expr: (100 - avg by (hote) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severite: attention
        annotations:
          resume: "{{ $labels.hote }} : processeur au-dessus de 90 % depuis 10 minutes"
