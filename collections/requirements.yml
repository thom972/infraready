---
# Collections Ansible utilisees par les playbooks InfraReady.
# Installation : ansible-galaxy collection install -r collections/requirements.yml
collections:
  - name: ansible.windows      # win_acl, win_share, win_package, win_updates...
  - name: community.windows    # win_firewall_rule (supervision.yml)
  - name: microsoft.ad         # ou, group, user, object_info (windows.yml)
  - name: community.general    # parted, filesystem, ufw (stockage.yml, securite.yml)
  - name: ansible.posix        # mount (stockage.yml)
