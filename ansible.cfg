# Configuration Ansible du projet InfraReady - lancer les commandes depuis la racine du depot.
[defaults]
inventory = inventory/hosts.yml
host_key_checking = True
retry_files_enabled = False
# Envoie les modules sans fichier temporaire. Place dans [defaults] pour s'appliquer
# a TOUTES les connexions : SSH (LINUX01) et locale (OPS01), qui ignore [connection].
# Permet become_user vers un compte non privilegie (keo, grafana) sans setfacl.
pipelining = True
