# Configuration Ansible du projet InfraReady - lancer les commandes depuis la racine du depot.
[defaults]
inventory = inventory/hosts.yml
host_key_checking = True
retry_files_enabled = False

[connection]
# Envoie les modules sans fichier temporaire (connexions SSH et locale) :
# plus rapide, et permet become_user vers un compte non privilegie sans setfacl.
pipelining = True
