---
# Variables communes au groupe [linux] de inventory.ini - aucun secret ici.
ansible_become: true                          # taches executees avec sudo (compte ansible, voir E-14)
ansible_python_interpreter: /usr/bin/python3  # interpreteur fixe : supprime l'avertissement de detection
web_package: nginx                            # paquet du service web a installer
web_service: nginx                            # service systemd correspondant
